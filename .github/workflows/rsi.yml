name: RSI Bot
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      manual:
        description: "Elle test mi? (true/false)"
        default: "true"
permissions:
  contents: write
concurrency:
  group: rsi-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python rsi_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_RUN: ${{ github.event.inputs.manual }}
      - name: Oneri kayitlarini sakla
        run: |
          git config user.name "rsi-bot"
          git config user.email "rsi-bot@users.noreply.github.com"
          git add signals.json || true
          git diff --cached --quiet || (git commit -m "oneri kayitlari" && git push)
